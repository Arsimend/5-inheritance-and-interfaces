<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="t">
  <title id="t">Perintä ja rajapinnat: Product-yliluokka, sen aliluokat Vehicle, Apartment ja Ticket sekä MarkdownExport-rajapinta</title>
  <rect x="1" y="1" width="318" height="168" rx="14" fill="#fbf7f0" stroke="#dcd8ce"/>
  <defs>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#fffdf9" stroke="#1c2327" stroke-width="1.4"/>
    </marker>
  </defs>
  <!-- aliluokat perivät yliluokan -->
  <g stroke="#1c2327" stroke-width="2" fill="none" marker-end="url(#inherit)">
    <path d="M48 116 V96 H126 V72"/>
    <path d="M126 116 V73"/>
    <path d="M204 116 V96 H126 V72"/>
  </g>
  <!-- yliluokka toteuttaa rajapinnan -->
  <path d="M176 46 H214" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#inherit)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="76" y="28" width="100" height="36" rx="6" fill="#f1e2d8" stroke="#b74a26" stroke-width="2"/>
    <text x="126" y="51" fill="#8c3419" font-weight="700" font-size="13">Product</text>
    <rect x="12" y="116" width="72" height="30" rx="6" fill="#fffdf9" stroke="#1c2327" stroke-width="1.6"/>
    <text x="48" y="135" fill="#1c2327">Vehicle</text>
    <rect x="86" y="116" width="80" height="30" rx="6" fill="#fffdf9" stroke="#1c2327" stroke-width="1.6"/>
    <text x="126" y="135" fill="#1c2327">Apartment</text>
    <rect x="168" y="116" width="72" height="30" rx="6" fill="#fffdf9" stroke="#1c2327" stroke-width="1.6"/>
    <text x="204" y="135" fill="#1c2327">Ticket</text>
    <rect x="218" y="22" width="94" height="48" rx="6" fill="#e0efe5" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="265" y="40" fill="#2d6a4f" font-size="10">«interface»</text>
    <text x="265" y="58" fill="#2d6a4f" font-size="9.5" font-weight="700">MarkdownExport</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#5f6b70">
    <line x1="12" y1="160" x2="28" y2="160" stroke="#1c2327" stroke-width="2"/>
    <text x="32" y="164">extends</text>
    <line x1="96" y1="160" x2="112" y2="160" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="116" y="164" fill="#2d6a4f">implements</text>
  </g>
